name: starred-randomizer
region: fra
services:
  - name: backend
    dockerfile_path: Dockerfile
    git:
      branch: master
      repo_clone_url: https://github.com/RubenPari/starred-randomizer.git
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: GITHUB_TOKEN
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: COOKIE_SECRET
        type: SECRET
      - key: DB_HOST
        type: SECRET
      - key: DB_PORT
        type: SECRET
      - key: DB_USER
        type: SECRET
      - key: DB_PASSWORD
        type: SECRET
      - key: DB_NAME
        type: SECRET
